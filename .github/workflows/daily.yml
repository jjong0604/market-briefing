name: daily-briefing
on:
  schedule:
    - cron: "0 22 * * 0-4"   # 한국시간 월~금 오전 7시
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas
      - name: 매수 타점 계산
        run: |
          cat > screener.py <<'PYEOF'
          import json, datetime
          import pandas as pd
          import yfinance as yf

          # 후보 종목: 이름 -> (야후 코드, 섹터).  코스피=.KS, 코스닥=.KQ  (여기만 고치면 종목 변경 가능)
          CAND = {
           "LS ELECTRIC": ("010120.KS", "전력"), "효성중공업": ("298040.KS", "전력"),
           "HD현대일렉트릭": ("267260.KS", "전력"), "산일전기": ("062040.KS", "전력"),
           "SK하이닉스": ("000660.KS", "반도체"), "삼성전자": ("005930.KS", "반도체"),
           "한미반도체": ("042700.KS", "반도체"), "리노공업": ("058470.KQ", "반도체"),
           "대한광통신": ("010170.KS", "광통신"), "광전자": ("017900.KS", "광통신"),
           "빛과전자": ("069540.KQ", "광통신"),
          }
          BENCH = "^KS11"

          def screen_one(df, bench_r6):
              c, h, l, v = df["Close"], df["High"], df["Low"], df["Volume"]
              ma50, ma150, ma200 = (c.rolling(n).mean() for n in (50, 150, 200))
              px = float(c.iloc[-1]); hi52 = float(h.tail(252).max()); lo52 = float(l.tail(252).min())
              r6 = px / float(c.iloc[-126]) - 1
              chk = [px > ma150.iloc[-1] and px > ma200.iloc[-1],
                     ma150.iloc[-1] > ma200.iloc[-1],
                     ma200.iloc[-1] > ma200.iloc[-22],
                     ma50.iloc[-1] > ma150.iloc[-1] and ma50.iloc[-1] > ma200.iloc[-1],
                     px > ma50.iloc[-1],
                     px >= lo52 * 1.3,
                     px >= hi52 * 0.75,
                     r6 > bench_r6]
              n = int(sum(bool(x) for x in chk))
              pivot = float(h.iloc[-21:-1].max())
              rng10 = h.tail(10).max() / l.tail(10).min() - 1
              rng_prev = h.iloc[-30:-10].max() / l.iloc[-30:-10].min() - 1
              tight = bool(rng10 < 0.6 * rng_prev)
              dry = bool(v.tail(10).mean() < v.tail(50).mean())
              volx = float(v.iloc[-1] / v.iloc[-51:-1].mean())
              dist = px / pivot - 1
              near50 = abs(px / float(ma50.iloc[-1]) - 1) <= 0.03
              if n < 8:
                  st, tone = f"관망 (추세 {n}/8)", "x"
              elif px > pivot * 1.05:
                  st, tone = f"추격 금지 (피벗 +{dist*100:.1f}%)", "late"
              elif px >= pivot and volx >= 1.4:
                  st, tone = "돌파 확인 — 매수 구간", "buy"
              elif px >= pivot:
                  st, tone = "돌파했지만 거래량 부족 — 대기", "wait"
              elif dist >= -0.05 and tight and dry:
                  st, tone = "대기 — 피벗 돌파 시 매수 (VCP 형성)", "ready"
              elif near50:
                  st, tone = "50일선 눌림 — 관찰", "watch"
              else:
                  st, tone = "추세 양호 — 베이스 형성 중", "watch"
              entry = px if tone == "buy" else pivot * 1.001
              return dict(price=round(px), trend=n, status=st, tone=tone, pivot=round(pivot),
                          buy_hi=round(pivot * 1.05), stop=round(entry * 0.93), target=round(entry * 1.20),
                          volx=round(volx, 2), dist=round(dist * 100, 1))

          def run():
              codes = [v[0] for v in CAND.values()] + [BENCH]
              data = yf.download(codes, period="2y", auto_adjust=True, group_by="ticker", progress=False)
              b = data[BENCH].dropna()
              bench_r6 = float(b["Close"].iloc[-1] / b["Close"].iloc[-126] - 1)
              mkt_ok = bool(b["Close"].iloc[-1] > b["Close"].rolling(50).mean().iloc[-1]
                            and b["Close"].rolling(50).mean().iloc[-1] > b["Close"].rolling(200).mean().iloc[-1])
              rows = []
              for name, (code, sec) in CAND.items():
                  try:
                      d = data[code].dropna()
                      if len(d) < 260: continue
                      r = screen_one(d, bench_r6); r.update(name=name, sector=sec, code=code); rows.append(r)
                  except Exception as e:
                      print("skip", name, e)
              order = {"buy": 0, "ready": 1, "wait": 2, "watch": 3, "late": 4, "x": 5}
              rows.sort(key=lambda r: (order[r["tone"]], -r["trend"]))
              kst = datetime.datetime.utcnow() + datetime.timedelta(hours=9)
              return dict(generated=kst.strftime("%Y-%m-%d %H:%M"), market_ok=mkt_ok,
                          kospi=round(float(b["Close"].iloc[-1]), 2), rows=rows)

          INDEX_HTML = """<!doctype html><html lang="ko"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="apple-mobile-web-app-capable" content="yes"><title>매수 타점 브리핑</title>
          <style>
          :root{--bg:#f6f4ef;--card:#fff;--ink:#1d1d1b;--mute:#76736b;--line:#ebe8e1}
          @media(prefers-color-scheme:dark){:root{--bg:#141412;--card:#1e1e1b;--ink:#ecebe6;--mute:#9a978e;--line:#2e2d29}}
          *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
          main{max-width:820px;margin:0 auto;padding:14px 12px 40px}h1{font-size:21px;margin:6px 4px 2px}.sub{color:var(--mute);font-size:12.5px;margin:0 4px 12px}
          .c{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--k);border-radius:12px;padding:11px 14px;margin:9px 0}
          .buy{--k:#2e9d4f}.ready{--k:#3b7dd8}.wait{--k:#e0a100}.watch{--k:#9a978e}.late{--k:#d63a3a}.x{--k:#bbb}
          .t{display:flex;justify-content:space-between;gap:8px}.s{color:var(--mute);font-size:12.5px}
          .g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;font-size:12.5px}.g b{display:block;font-size:14px}
          .m{padding:10px 14px;border-radius:12px;margin:8px 0;font-size:14px;background:var(--card);border:1px solid var(--line)}
          footer{color:var(--mute);font-size:11.5px;margin-top:22px;line-height:1.6}
          </style></head><body><main><h1>📈 매수 타점 브리핑</h1><p class="sub" id="sub">불러오는 중…</p><div id="a"></div>
          <footer><b>적용 기법</b> 마크 미너비니의 SEPA — ① 트렌드 템플릿 8조건(150·200일선 위, 200일선 상승, 50일선 정렬, 52주 고가 -25% 이내, 저가 +30%↑, 6개월 수익률이 코스피 상회) 통과 종목만, ② 수축하는 눌림(VCP) 뒤 <b>피벗 돌파 + 거래량 평소 140%↑</b>에서 매수, ③ 피벗 +5% 넘으면 추격 금지, ④ 손절 -7%, ⑤ +20% 부근 일부 익절.<br>
          무료 시세는 지연·오차가 있습니다. 호가단위에 맞춰 조정하고 주문 전 차트를 직접 확인하세요. 개인 참고용이며 매수 권유가 아닙니다. 투자 판단과 책임은 본인에게 있습니다.</footer></main>
          <script>
          const f=n=>n.toLocaleString("ko-KR");
          fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{
           document.getElementById("sub").textContent="한국시간 "+d.generated+" 기준 · 전 거래일 종가";
           let h=`<div class="m">${d.market_ok?"🟢 시장 필터 통과 — 코스피 "+f(d.kospi)+"가 50일선 위, 50일선이 200일선 위":"🔴 시장 필터 미통과 — 코스피 "+f(d.kospi)+"가 추세 아래. 신규 매수는 비중을 줄이거나 쉬는 게 원칙입니다"}</div>`;
           h+=d.rows.map(r=>`<div class="c ${r.tone}"><div class="t"><b>${r.name}</b><span class="s">${r.sector} · 추세 ${r.trend}/8</span></div>
           <div class="s">${r.status}</div><div class="g"><div>현재가<b>${f(r.price)}</b></div><div>매수 트리거<b>${f(r.pivot)}</b></div><div>추격 상한<b>${f(r.buy_hi)}</b></div><div>손절<b>${f(r.stop)}</b></div></div>
           <div class="s" style="margin-top:6px">1차 목표 ${f(r.target)} · 오늘 거래량 평소의 ${r.volx}배 · 피벗 대비 ${r.dist}%</div></div>`).join("");
           document.getElementById("a").innerHTML=h;}).catch(()=>document.getElementById("a").textContent="데이터를 불러오지 못했습니다.");
          </script></body></html>"""

          if __name__ == "__main__":
              d = run()
              json.dump(d, open("data.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
              open("index.html", "w", encoding="utf-8").write(INDEX_HTML)
          PYEOF
          python screener.py
      - run: |
          git config user.name "briefing-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html data.json
          git diff --staged --quiet || (git commit -m "update" && git push)
